{% extends "base.html" %}

{% block content %}

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
 <h1 style="margin:0;">CRM</h1>
 <div style="display:flex;gap:8px;">
 <button class="tab-btn active" onclick="setTab('tabela')">Tabela</button>
 <button class="tab-btn" onclick="setTab('pipeline')">Pipeline</button>
 </div>
</div>

<!-- KPI rápidos -->
<div class="crm-kpis" id="crm-kpis"></div>

<!-- TAB: TABELA -->
<div id="tab-tabela">
 <div class="card" style="padding:0;overflow:hidden;">
 <table class="crm-table">
 <thead>
 <tr>
 <th>Nome</th>
 <th>Produto</th>
 <th>Origem</th>
 <th>Status</th>
 <th>Temperatura</th>
 <th>Score</th>
 <th>Próxima ação</th>
 </tr>
 </thead>
 <tbody id="crm-tbody"></tbody>
 </table>
 </div>
</div>

<!-- TAB: PIPELINE KANBAN -->
<div id="tab-pipeline" style="display:none;">
 <div class="kanban">
 <div class="kanban-col">
 <div class="kanban-header">Entrada</div>
 <div class="kanban-cards" id="col-entrada"></div>
 </div>
 <div class="kanban-col">
 <div class="kanban-header">Interessado</div>
 <div class="kanban-cards" id="col-interessado"></div>
 </div>
 <div class="kanban-col">
 <div class="kanban-header">Qualificado</div>
 <div class="kanban-cards" id="col-qualificado"></div>
 </div>
 <div class="kanban-col">
 <div class="kanban-header" style="color:#4ade80;">Fechado</div>
 <div class="kanban-cards" id="col-fechado"></div>
 </div>
 </div>
</div>

<style>
/* KPI strip */
.crm-kpis { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.crm-kpi { background:rgba(255,255,255,.04); border:1px solid #1e293b; border-radius:10px; padding:12px 18px; min-width:130px; }
.crm-kpi-label { font-size:.72rem; opacity:.5; text-transform:uppercase; }
.crm-kpi-val { font-size:1.5rem; font-weight:700; color:#38bdf8; margin-top:2px; }

/* Tab buttons */
.tab-btn { padding:6px 16px; border-radius:6px; font-size:.82rem; border:1px solid #334155; background:#1e293b; color:#64748b; cursor:pointer; }
.tab-btn.active { background:#7c3aed22; border-color:#7c3aed; color:#a78bfa; }

/* Table */
.crm-table { width:100%; border-collapse:collapse; font-size:.85rem; }
.crm-table thead { background:#1a2535; }
.crm-table th { padding:10px 14px; text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; opacity:.5; font-weight:600; }
.crm-table td { padding:10px 14px; border-bottom:1px solid #0f1a27; }
.crm-table tr:last-child td { border-bottom:none; }
.crm-table tr:hover td { background:#0f1a27; }

/* Temperatura badges */
.temp { padding:2px 8px; border-radius:12px; font-size:.72rem; font-weight:700; }
.temp.quente { background:#ef444422; border:1px solid #f87171; color:#f87171; }
.temp.morno { background:#f59e0b22; border:1px solid #fbbf24; color:#fbbf24; }
.temp.frio { background:#38bdf822; border:1px solid #38bdf8; color:#38bdf8; }

/* Stage badge */
.stage { padding:2px 8px; border-radius:12px; font-size:.72rem; background:#1e293b; border:1px solid #334155; color:#94a3b8; }

/* Score bar */
.score-wrap { display:flex; align-items:center; gap:6px; }
.score-bar { width:50px; background:#1e293b; border-radius:3px; height:4px; }
.score-fill { height:4px; border-radius:3px; }

/* Kanban */
.kanban { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kanban-col { background:#0d1624; border-radius:10px; padding:12px; min-height:200px; }
.kanban-header { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.5; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #1e293b; }
.kanban-card { background:#1e293b; border-radius:8px; padding:12px; margin-bottom:8px; border:1px solid #334155; }
.k-name { font-weight:600; font-size:.88rem; margin-bottom:4px; }
.k-prod { font-size:.75rem; opacity:.5; margin-bottom:6px; }
.k-score { font-size:.78rem; display:flex; align-items:center; gap:6px; }
.k-msg { font-size:.72rem; opacity:.45; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>

<script>
const STAGE_COLS = {
 'entrada': 'col-entrada',
 'interessado':'col-interessado',
 'qualificado':'col-qualificado',
 'fechado': 'col-fechado',
};

const TEMP_COLOR = { quente:'#f87171', morno:'#fbbf24', frio:'#38bdf8' };

function scoreColor(s) {
 if (s >= 75) return '#4ade80';
 if (s >= 50) return '#fbbf24';
 return '#f87171';
}

function nextAction(lead) {
 const seq = lead.followup_sequence || [];
 if (seq.length === 0) return '—';
 return `Dia ${seq[0].day}: follow-up`;
}

async function loadCRM() {
 try {
 const leads = await fetch('/api/crm').then(r => r.json());

 // KPIs
 const total = leads.length;
 const quentes = leads.filter(l => l.temperature === 'quente').length;
 const avgScore= Math.round(leads.reduce((a,l)=>a+l.score,0)/Math.max(1,total));
 document.getElementById('crm-kpis').innerHTML = `
 <div class="crm-kpi"><div class="crm-kpi-label">Total leads</div><div class="crm-kpi-val">${total}</div></div>
 <div class="crm-kpi"><div class="crm-kpi-label">Quentes </div><div class="crm-kpi-val" style="color:#f87171">${quentes}</div></div>
 <div class="crm-kpi"><div class="crm-kpi-label">Score médio</div><div class="crm-kpi-val" style="color:${scoreColor(avgScore)}">${avgScore}</div></div>
 <div class="crm-kpi"><div class="crm-kpi-label">Em qualificação</div><div class="crm-kpi-val">${leads.filter(l=>l.pipeline_stage==='qualificado').length}</div></div>
 `;

 // Tabela
 document.getElementById('crm-tbody').innerHTML = leads.map(l => `
 <tr>
 <td><strong>${l.name}</strong></td>
 <td style="opacity:.7">${l.idea_title}</td>
 <td style="opacity:.6;font-size:.78rem">${l.source.replace(/_/g,' ')}</td>
 <td><span class="stage">${l.pipeline_stage}</span></td>
 <td><span class="temp ${l.temperature}">${l.temperature}</span></td>
 <td>
 <div class="score-wrap">
 <div class="score-bar"><div class="score-fill" style="width:${l.score}%;background:${scoreColor(l.score)}"></div></div>
 <span style="font-size:.78rem;color:${scoreColor(l.score)}">${l.score}</span>
 </div>
 </td>
 <td style="font-size:.78rem;opacity:.6">${nextAction(l)}</td>
 </tr>`).join('');

 // Kanban
 Object.values(STAGE_COLS).forEach(id => document.getElementById(id).innerHTML = '');
 leads.forEach(l => {
 const colId = STAGE_COLS[l.pipeline_stage] || 'col-entrada';
 const col = document.getElementById(colId);
 const tc = TEMP_COLOR[l.temperature] || '#64748b';
 col.innerHTML += `
 <div class="kanban-card" style="border-left:3px solid ${tc}">
 <div class="k-name">${l.name}</div>
 <div class="k-prod">${l.idea_title}</div>
 <div class="k-score">
 <div class="score-bar" style="width:40px"><div class="score-fill" style="width:${l.score}%;background:${scoreColor(l.score)}"></div></div>
 <span style="color:${scoreColor(l.score)};font-weight:700">${l.score}</span>
 <span class="temp ${l.temperature}">${l.temperature}</span>
 </div>
 <div class="k-msg">${l.message}</div>
 </div>`;
 });
 } catch(e) { console.warn('CRM:', e); }
}

function setTab(tab) {
 document.getElementById('tab-tabela').style.display = tab === 'tabela' ? '' : 'none';
 document.getElementById('tab-pipeline').style.display = tab === 'pipeline' ? '' : 'none';
 document.querySelectorAll('.tab-btn').forEach((b,i) => {
 b.classList.toggle('active', (i===0 && tab==='tabela') || (i===1 && tab==='pipeline'));
 });
}

loadCRM();
setInterval(loadCRM, 15000);
</script>

{% endblock %}
