name: smoke

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check for new legacy imports
        run: |
          NEW_LEGACY=$(git diff origin/main...HEAD -- '*.py' \
            | grep '^+' \
            | grep -E "from (orchestrator|master_controller|orch_core_legacy)" || true)
          if [ -n "$NEW_LEGACY" ]; then
            echo "Novos imports legados detectados — use orch_core.adapters:"
            echo "$NEW_LEGACY"
            exit 1
          fi

      - name: Run smoke tests
        run: pytest tests/ -q
